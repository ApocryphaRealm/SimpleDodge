; Simple Dodge - settings. Edit here or on the Apocrypha Menu Framework page (Mod Control Panel > Simple Dodge).
; Changes made on the page apply at once; Save writes them to this file.

[Settings]
bStepDodge = true
bEnableDodgeInPlace = true
sDefaultDodgeEvent = "TKDodgeBack"
bRemoveForwardDodge = false
; Diagonal directions get their own dodge (off: the four main directions only)
bEightWayDodge = true
; Rolls travel 1.5x as far as a step dodge (off: as far as the step). Needs Nemesis or Pandora run again.
bLongRoll = true
bDisableInThird = false
fIFrameDuration = 0.30
; Key codes: 0-255 keyboard (DirectInput scan code), 256+ mouse, 266+ controller; 1 = unbound. 42 = Left Shift.
uDodgeKey = 42
bUseDoubleTap = false
; Tap a movement key (or flick the left stick) twice quickly to dodge that way
bDirectionalDoubleTap = false
bUseSprintKey = true
fSprintingPressDuration = 0.30
bEnableSneakKeyDodge = false
fSneakingPressDuration = 0.50
fDodgeCost = 15.00
bUsePercentageCost = true
bEnableDodgeAttackCancel = true
bOnlyCancelLightAttacks = false
bUseMCORecoverWindow = false
bEnableSneakDodge = false
bUsePerkLock = false

[Forms]
; "Plugin.esp|0x800" (local form ID) or an EditorID
sDodgeRequiredPerkID = "Simple Dodge.esp|0x800"
sOnDodgeSpellID = "Simple Dodge.esp|0x802"
sOnDodgeSpellRequiredPerkID = "Simple Dodge.esp|0x801"

[Debug]
; 0 trace (everything - set this for a bug report), 1 debug, 2 info (the default), 3 warn, 4 error, 5 critical, 6 off
uLogLevel = 2
